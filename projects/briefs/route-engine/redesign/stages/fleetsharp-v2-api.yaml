  /customers:
    get:
      security:
        - Bearer: []
      summary: Get all customers.
      description: Returns information on all active customers.
      tags:
        - Customers
      responses:
        200:
          description: Customer information
          schema:
            type: array
            items:
              $ref: '#/definitions/CustomerInfo'
        401:
          description: Unauthorized
        500:
          description: Unexpected error
    put:
      security:
        - Bearer: []
      summary: Update customers
      description: |
        Submits an update for one or more existing customers. <br/>
        If the update is successfully queued, an array of the newly-created Uploaded Customer objects will be returned.
        After being queued, processing proceeds like this:
        * The Uploaded Customer entries will start in RAW status.
        * Every five minutes, the queue is read, and all RAW Uploaded Customer entries are validated for basic issues like missing data.
        * If any validation errors are found with an Uploaded Customer, it's put in PROCESSED status, and any errors are recorded to it. No further action will be taken until the errors are corrected.
        * If no validation errors are found, the Uploaded Customer moves to PROCESSING status. The system will attempt to validate the address for every location on the Uploaded Customer.
          This is an asynchronous call, so it can take an indeterminate amount of time.
        * After address validation, processing proceeds based on the value of the Confirmation field.
          * **If the Confirmation field is set to NONE**, the customer will be updated with the new data immediately, regardless of whether there were any errors. The uploaded Customers will be set to CREATED status.
          * **If the Confirmation field is set to ON UPLOAD ERROR** and _all_ customers in this upload successfully processed, this customer will be updated at the end. The Uploaded Customer will be set to CREATED status.
          * **If the Confirmation field is set to ON UPLOAD ERROR** and _any_ customer in this upload had an error, the Uploaded Customer will be set to PROCESSED status. It won't be updated until you manually validate it in the UI or by calling the /customers
          /uploads/finalize endpoints.
          * **If the Confirmation field is set to NONE ON SUCCESS** and *all* customers in this upload successfully processed, this customer will be updated with new data immediately.  The uploaded Customers will be set to CREATED status.
          * **If the Confirmation field is set to NONE ON SUCCESS** and *any* customer in this upload had an error, the Uploaded Customer will be set to CREATION FAILED status.  It will no longer be visible or accessible for corrections or updates otherwise. 
          * **If the Confirmation field is set to ALWAYS**, the customer will not be updated. The Uploaded Customer will be set to PROCESSED status. It won't be updated until you manually validate it in the UI or by calling the /customers/uploads/finalize endpoints.
        <!-- -->
        During this process, you can use the /customers/uploads endpoints to check on the status of processing or make updates if needed.<br/><br/>
        Please see the Confirmation field in the body description for more details.<br/>
        Any entries in CREATED status will be deleted after one week, and any entries in PROCESSED status will be deleted after two weeks.
      tags:
        - Customers
      parameters:
        - name: customers
          description: An array of customers to update.
          in: body
          required: true
          schema:
            type: array
            items:
              $ref: '#/definitions/ApiUploadedCustomerCreate'
      responses:
        200:
          description: Uploaded Customer information
          schema:
            type: array
            items:
              $ref: '#/definitions/UploadedCustomer'
        401:
          description: Unauthorized
        422:
          description: Processing error
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error
    post:
      security:
        - Bearer: []
      summary: Upload new customers.
      description: |
        Submits a request to create one or more new customers customers. <br/>
        If the update is successfully queued, an array of the newly-created Uploaded Customer objects will be returned.
        After being queued, processing proceeds like this:
        * The Uploaded Customer entries will start in RAW status.
        * Every five minutes, the queue is read, and all RAW Uploaded Customer entries are validated for basic issues like missing data.
        * If any validation errors are found with an Uploaded Customer, it's put in PROCESSED status, and any errors are recorded to it. No further action will be taken until the errors are corrected.
        * If no validation errors are found, the Uploaded Customer moves to PROCESSING status. The system will attempt to validate the address for every location on the Uploaded Customer.
          This is an asynchronous call, so it can take an indeterminate amount of time.
        * After address validation, processing proceeds based on the value of the Confirmation field.
          * **If the Confirmation field is set to NONE**, the customer will be created with the new data immediately, regardless of whether there were any errors. The uploaded Customers will be set to CREATED status.
          * **If the Confirmation field is set to ON UPLOAD ERROR** and _all_ customers in this upload successfully processed, this customer will be created at the end. The Uploaded Customer will be set to CREATED status.
          * **If the Confirmation field is set to ON UPLOAD ERROR** and _any_ customer in this upload had an error, the Uploaded Customer will be set to PROCESSED status. It won't be created until you manually validate it in the UI or by calling the /customers/uploads/finalize endpoints.
          * **If the Confirmation field is set to NONE ON SUCCESS** and *all* customers in this upload successfully processed, this customer will be updated with new data immediately.  The uploaded Customers will be set to CREATED status.
          * **If the Confirmation field is set to NONE ON SUCCESS** and *any* customer in this upload had an error, the Uploaded Customer will be set to CREATION FAILED status.  It will no longer be visible or accessible for corrections or updates otherwise. 
          * **If the Confirmation field is set to ALWAYS**, the customer will not be updated. The Uploaded Customer will be set to PROCESSED status. It won't be created until you manually validate it in the UI or by calling the /customers/uploads/finalize endpoints.
        <!-- -->
        During this process, you can use the /customers/uploads endpoints to check on the status of processing or make updates if needed.<br/><br/>
        Please see the Confirmation field in the body description for more details.<br/>
        Any entries in CREATED status will be deleted after one week, and any entries in PROCESSED status will be deleted after two weeks.
      tags:
        - Customers
      parameters:
        - name: customers
          description: An array of customers to update.
          in: body
          required: true
          schema:
            type: array
            items:
              $ref: '#/definitions/ApiUploadedCustomerCreate'
      responses:
        200:
          description: Uploaded Customer information
          schema:
            type: array
            items:
              $ref: '#/definitions/UploadedCustomer'
        401:
          description: Unauthorized
        422:
          description: Processing error
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error

