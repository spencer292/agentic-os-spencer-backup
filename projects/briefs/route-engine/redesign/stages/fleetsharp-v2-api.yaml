      tags:
        - Geofences
      parameters:
        - name: geofenceUUID
          in: path
          description: Unique identifier of geofence.
          required: true
          type: string
      responses:
        200:
          description: Geofence notification information
          schema:
            $ref: '#/definitions/GeofenceNotification'
        403:
          description: Unauthorized
        404:
          description: Geofence not found, or no notification exists for the geofence.
        500:
          description: Unexpected error
    delete:
      security:
        - Bearer: []
      summary: Remove geofence notification.
      description: |
        Clears all custom settings on a geofence notification and deactivates it.

        Note that the notification will not be outright deleted. Every geofence has a notification that does nothing
        (monitors nothing and sends no updates) by default. This call will return the notification to that state.
      tags:
        - Geofences
      parameters:
        - name: geofenceUUID
          in: path
          description: Unique identifier of geofence.
          required: true
          type: string
      responses:
        204:
          description: Notification was successfully cleared.
        403:
          description: Unauthorized
        404:
          description: Geofence not found, or no notification exists for the geofence.
        500:
          description: Unexpected error
    put:
      security:
        - Bearer: []
      summary: Update geofence notification
      description: |
        Updates the given fields on a geofence notification.
        If the notification doesn't already exist, it will be created.
        Most fields will not be updated if they are not sent in. The exceptions:
        * If trackers, drivers, or groups are sent, the MonitorAll flag will be set to false.
        * If the MonitorAll flag is set to true, any existing trackers, drivers, or groups will be removed from individual notifications, and any value submitted for those fields in the same message will be ignored.
        * If trackers, drivers, or groups are sent, the others will be cleared. (Submitting drivers will remove all existing tracker-based geofence notifications, etc.)
      tags:
        - Geofences
      parameters:
        - name: geofenceUUID
          in: path
          description: Unique identifier of geofence.
          required: true
          type: string
        - name: geofenceNotificationUpdateInfo
          in: body
          description: Object containing the fields to update.
          schema:
            $ref: '#/definitions/GeofenceNotificationUpdateInfo'
      responses:
        200:
          description: Geofence notification information
          schema:
            $ref: '#/definitions/GeofenceNotification'
        403:
          description: Unauthorized
        404:
          description: Geofence not found, or no notification exists for the geofence.
        422:
          description: Invalid data submitted.
        500:
          description: Unexpected error

  /geofences/activity:
    get:
      security:
        - Bearer: []
      summary: Get geofence activity
      description: |
        Gets geofence activity between the start and end dates. Supports paginated results if offset and limit parameters are provided.
        If making a paginated request with a limit of &#60;= 1000, you can query for up to 93 days of data at a time. Other requests are limited to up to 48 hours.
      tags:
        - Geofences
      parameters:
        - name: start
          in: query
          type: integer
          format: int64
          required: true
          description: Start time of the date range to search for, in milliseconds since the epoch.
        - name: end
          in: query
          type: integer
          format: int64
          required: true
          description: |
            End time of the date range to search for, in milliseconds since the epoch.
            If `limit` is &#60;= 1000, this can be up to 93 days after the start time. Otherwise, it must be 48 hours or less.
        - name: offset
          in: query
          type: integer
          format: int32
          required: false
          description: The number of records by which to offset the results. If paginating results, this should be equal to `([the page number you want to retrieve] - 1) * [limit]`. e.g. with a limit of 250, enter an offset of 0 for the first page, 250 for the second page, etc.
        - name: limit
          in: query
          type: integer
          format: int32
          required: false
          description: The number of records to retrieve in one call. Use along with the offset parameter to paginate results. Limit must be &#60;= 1000 to request more than 48 hours of data at once.
      responses:
        200:
          description: Geofence notification information
          schema:
            type: array
            items:
              $ref: '#/definitions/GeofenceActivity'
        403:
          description: Unauthorized
        422:
          description: Dates are invalid or empty.
        500:
          description: Unexpected error
    post:
      security:
        - Bearer: []
      summary: Get filtered geofence activity
      description: |
        Gets geofence activity between the start and end dates, optionally filtered on geofence, groups, trackers, and drivers. Supports paginated results if offset and limit parameters are provided.
        If making a paginated request with a limit of &#60;= 1000, you can query for up to 93 days of data at a time. Other requests are limited to up to 48 hours.
      tags:
        - Geofences
      parameters:
        - name: criteria
          description: Criteria to use for querying the geofence visits.
          in: body
          required: true
          schema:
            $ref: '#/definitions/GeofenceActivityRequest'
      responses:
        200:
          description: Geofence notification information
          schema:
            type: array
            items:
              $ref: '#/definitions/GeofenceActivity'
        403:
          description: Unauthorized
        404:
          description: Request contains an invalid geofence or group ID.
        422:
          description: Dates are invalid or empty, or none of the requested groups contain trackers.
        500:
          description: Unexpected error

