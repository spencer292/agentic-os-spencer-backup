  UploadedCustomer:
    type: object
    properties:
      uploadedCustomerId:
        type: integer
        format: int64
        description: ID of the Uploaded Customer.
      companyId:
        type: integer
        format: int64
        description: ID of the company.
      status:
        type: string
        description: |
          Status of the Uploaded Customer. One of:
          * **RAW**: The Uploaded Customer was recently submitted, and hasn't yet been validated.
          * **PROCESSING**: The Uploaded Customer has passed initial validation, and the system is now attempting to validate the location addresses and map them to coordinates if possible.
          * **PROCESSED**: The Uploaded Customer has finished processing. If it doesn't have any errors, it's ready to create (see the /customers/uploads/finalize endpoints.) If it has errors, you can use the /customers/uploads PUT call to update it and reprocess it, or finalize it to create the customer with the existing errors.
          * **CREATED**: The Uploaded Customer has created or updated a Customer as appropriate. The customer ID should be in the customerId field.
          * **CREATION FAILED**: The Uploaded Customer was not created or updated because it encountered an error and was part of a batch designated with the confirmation level 'NONE ON SUCCESS'.  Instead of an automatic confirmation upon a completely successful upload, the individual upload was terminated and considered to have failed.
      customerName:
        type: string
        description: Customer's name.
      fleet:
        type: string
        description: Not yet implemented. Data type may change.
      email:
        type: string
        description: Customer's contact email.
      phone:
        type: string
        description: Customer's contact phone number, as entered.
      notes:
        type: string
        description: User-provided notes on the customer.
      externalId:
        type: string
        description: User-provided ID for the customer, to identify them within other systems.
      confirmation:
        type: string
        description: |
          Should be one of the following values:
          * **ALWAYS**: Behaves the same as uploading a customer spreadsheet in the portal.
          After processing, whether or not there are any errors, the Uploaded Customer will be left in PROCESSED status.
          It won't be created until you manually validate it in the UI or by calling the /customers/uploads/finalize endpoints.
          * **NONE ON SUCCESS**: If the Uploaded Customer was validated and mapped to GPS coordinates successfully, it will be deemed CREATED. If all customer uploads contained within a given batch feature this confirmation type, that batch will be finalized immediately and automatically - no updates can be done once this happens.  Should an error occur concerning an individual upload, this Uploaded Customer would then acquire the status *CREATION FAILED* and batch processing would continue.  However, rather than remain in progress, the upload status is final with the corresponding data discarded.
          * **ON UPLOAD ERROR**: Default behavior for uploads through the API.
          If _all_ customers in this upload successfully process, this customer will be created at the end. The Uploaded Customer will be set to CREATED status. The customer ID for the new customer will be added.
          If _any_ customers in this upload have errors, this Uploaded Customer will be left in PROCESSED status.
          It won't be created until you manually validate it in the UI or by calling the /customers/uploads/finalize endpoints.
          * **NONE**: If the Uploaded Customer passes initial validation (isn't missing an address, doesn't have an invalid state, etc) then the customer will be updated, whether or not the address can be validated and mapped to coordinates.
          If the Uploaded Customer fails at initial validation, it will be left in PROCESSED status.
          Otherwise, the customer will be created, and the Uploaded Customer will be put in CREATED status. The customer ID for the new customer will be added.
      customerId:
        type: integer
        format: int64
        description: If this Uploaded Customer is a request to update an existing customer, the ID of the customer to update. Otherwise, if the Uploaded Customer is in CREATED status, the ID of the newly-created customer.
      editPersonId:
        type: integer
        format: int64
        description: ID of the last person to edit the Uploaded Customer entry.
      processedDate:
        type: integer
        format: int64
        description: |
          The time, in seconds since the epoch, that the Uploaded Customer was last updated, including automatic processing by the system.
      errors:
        type: array
        items:
          $ref: '#/definitions/UploadedCustomerError'
      uploadedCustomerLocations:
        type: array
        items:
          $ref: '#/definitions/UploadedCustomerLocation'

  UploadedCustomerLocation:
    type: object
    properties:
      uploadedCustomerLocationId:
        type: integer
        format: int64
        description: ID of the Uploaded Customer Location.
      companyId:
        type: integer
        format: int64
        description: ID of the company.
      address1:
        type: string
        description: Line 1 of the location's street address.
      address2:
        type: string
        description: Line 2 of the location's street address.
      city:
        type: string
        description: The city of the location's address.
      state:
        type: string
        description: The two-letter state code of the location's address.
      zip:
        type: string
        description: The location's ZIP or postal code.
      coordinates:
        type: string
        description: The user-provided coordinates for the location, in latitude/longitude decimal degrees (e.g. 45.096926045500744, -94.41017717288022).
          If provided, this will override the coordinates determined by parsing the address.
      addressString:
        type: string
        description: The full formatted user-provided address.
      geocodedLatitude:
        type: number
        format: double
        description: The latitude for the location, determined by looking up the address. May be blank if errors occur while trying to look up the provided address.
      geocodedLongitude:
        type: number
        format: double
        description: The longitude for the location, determined by looking up the address. May be blank if errors occur while trying to look up the provided address.
      geocodedAddress:
        type: string
        description: The full, valid address for the user after processing. May be blank if errors occur while trying to look up the provided address.
      status:
        type: string
        description: |
          Status of the Uploaded Customer Location. One of:
          * **RAW**: The Uploaded Customer was recently submitted, and hasn't yet been validated.
          * **PROCESSING**: The Uploaded Customer Location has passed initial validation, and the system is now attempting to validate the address and map it to coordinates if possible.
          * **PROCESSED**: The Uploaded Customer Location has finished processing. The Uploaded Customer may or may not be ready to create, depending on the status of other locations.
          * **CREATED**: The Uploaded Customer Location has created or updated a Customer Location as appropriate. The customer location ID should be in the customerLocationId field.
      customerLocationId:
        type: integer
        format: int64
        description: If this Uploaded Customer Location is a request to update an existing Customer Location, the ID of the location to update. Otherwise, if the Uploaded Customer Location is in CREATED status, the ID of the newly-created Customer Location.
      customerLocationExternalId:
        type: string
        description: User-provided ID for the customer location, to identify them within other systems.
      errors:
        type: array
        items:
          $ref: '#/definitions/UploadedCustomerLocationError'

  UploadedCustomerError:
    type: object
    properties:
      uploadedCustomerErrorId:
        type: integer
        format: int64
        description: Internal ID of the Uploaded Customer Error.
      companyId:
        type: integer
        format: int64
        description: ID of the company.
      columnIndex:
        type: integer
        format: int32
        description: |
          Index of the customer field that has with the error, where applicable. The columns and their indices are currently:
          * 0 - Customer Name
          * 1 - Group
          * 2 - Email Address
          * 3 - Phone Number
          * 4 - External ID
          * 5 - Notes
      errorText:
        type: string
        description: Text describing the error.

  UploadedCustomerLocationError:
    type: object
    properties:
      uploadedCustomerLocationErrorId:
        type: integer
        format: int64
        description: Internal ID of the Uploaded Customer Location Error.
      companyId:
        type: integer
        format: int64
        description: ID of the company.
      columnIndex:
        type: integer
        format: int32
        description: |
          Index of the customer location field that has the error, where applicable. The columns and their indices are currently:
          * 6 - Street Address
          * 7 - Address Line 2
          * 8 - City
          * 9 - State
          * 10 - ZIP
          * 11 - Coordinates
      errorText:
        type: string
        description: Text describing the error.

