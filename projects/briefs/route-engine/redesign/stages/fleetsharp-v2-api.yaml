        200:
          description: Information on the created customer
          schema:
            $ref: '#/definitions/CustomerInfo'
        401:
          description: Unauthorized
        404:
          description: Not found
        422:
          description: Processing error
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error

  /safety-report-card:
    get:
      security:
        - Bearer: []
      summary: Get safety report card information over a period.
      description: Gets safety report card information between the start and end times, for all drivers and fleets visible to the calling user.
      tags:
        - Safety Report Card
      parameters:
        - name: start
          in: query
          type: integer
          format: int64
          required: true
          description: Start time of the date range to search for, in milliseconds since the epoch.
        - name: end
          in: query
          type: integer
          format: int64
          required: true
          description: End time of the date range to search for, in milliseconds since the epoch. Must be within 93 days of the start time.
      responses:
        200:
          description: A summary of safety information over the period.
          schema:
            $ref: '#/definitions/SafetyReportCard'
        401:
          description: Unauthorized
        422:
          description: Processing error
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error
    post:
      security:
        - Bearer: []
      summary: Get safety report card information with filtering.
      description: Gets safety report card information between the start and end times, optionally filtered by fleet, tracker, and user.
        The fleetIds, trackerIds, and userIds arrays are all optional. If included, only records that match all criteria will be returned. For
        example, if group IDs and user IDs are both submitted, every must be a member of one of the groups.
      tags:
        - Safety Report Card
      parameters:
        - name: criteria
          description: Criteria to use for querying the visits.
          in: body
          required: true
          schema:
            $ref: '#/definitions/SafetyReportCardRequest'
      responses:
        200:
          description: A summary of safety information over the period.
          schema:
            $ref: '#/definitions/SafetyReportCard'
        401:
          description: Unauthorized
        422:
          description: Processing error
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error

  /push-config:
    get:
      security:
        - Bearer: []
      summary: Get push API configuration settings.
      description: Gets push API configuration settings for this account.
      tags:
        - Push API Config
      responses:
        200:
          description: Push API configuration settings.
          schema:
            $ref: '#/definitions/PushApiConfig'
        401:
          description: Unauthorized
        404:
          description: No push API configuration exists for this account.
        409:
          description: Returned when this account has a non-standard push API configuration. These cannot be viewed or modified through this API at this time.
        500:
          description: Unexpected error
    post:
      security:
        - Bearer: []
      summary: Update push API configuration settings.
      description: Updates push API configuration settings for this account.
      tags:
        - Push API Config
      parameters:
        - name: Push API configuration
          description: New push API configuration for this account.
          in: body
          required: true
          schema:
            $ref: '#/definitions/PushApiConfig'
      responses:
        200:
          description: Settings were successfully updated.
        401:
          description: Unauthorized
        409:
          description: Returned when this account has an existing non-standard push API configuration. These cannot be viewed or modified through this API at this time.
        500:
          description: Unexpected error

  /media/{mediaId}:
    get:
      security:
        - Bearer: []
      parameters:
        - name: mediaId
          in: path
          description: ID of the Media entry
          required: true
          type: integer
          format: int64
      summary: Get media entry.
      description: Retrieves the URLs for the individual components of a dashcam media clip. 
        These can include an internal-facing video, an external-facing video, and a thumbnail for either of these. 
        Please note that depending on the vendor, the camera model, and the type of event that triggered the clip, 
        these URLs will not always all be populated. Vendors also only retain the media for a clip for a fixed amount 
        of time. In the event that the vendor no longer has videos or thumbnails to display, but the media ID represents
        a valid record in our system, this API will return successfully, but no URLs will be populated.
      tags:
        - Media
      responses:
        200:
          description: A summary of clip, and URLs to the individual media components, if present.
          schema:
            $ref: '#/definitions/Media'
        '3XX':
          description: An unexpected error occurred while communicating with the vendor.
        401:
          description: Unauthorized
        403:
          description: The user does not have permission to access the requested clip.
        404:
          description: No media clip by this ID was found.
        '4XX':
          description: An unexpected error occurred while communicating with the vendor.
        500:
          description: Unexpected error
        '5XX':
          description: An unexpected error occurred while communicating with the vendor.

  /company:
    get:
      security:
        - Bearer: []
      summary: Retrive company info
      description: Retrives company information like company name, created date, service tier, if it has input sensor data, and their api host.
        It will also list if they have different types of trackers like Asset, Vehicle, Wired, Plugin, Mini and ATLT trackers.
      tags:
        - Company
      responses:
        200:
          description: There will be a responseType field of either 'Success' or 'Error'. If successful, will list relevent company data. If the call fails, will say access denied.
          schema:
            $ref: '#/definitions/Company'
        401:
          description: Unauthorized
        500:
          description: Unexpected error

