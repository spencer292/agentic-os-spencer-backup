    post:
      security:
        - Bearer: []
      summary: Finalize an Uploaded Customer.
      description: Attempts to finish the given Uploaded Customer entry as long as it's in PROCESSED status, creating or updating a Customer as appropriate.
        This includes entries with errors or that are missing coordinates, so any issues with the uploaded data should be addressed before calling this endpoint.
        If successful, returns the newly-created customer. The Uploaded Customer record will be deleted.
      tags:
        - Customers
      parameters:
        - name: uploadedCustomerId
          in: path
          description: ID of the UploadedCustomer
          required: true
