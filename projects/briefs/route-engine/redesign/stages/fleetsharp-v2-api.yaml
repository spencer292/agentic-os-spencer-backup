      offset:
        type: integer
        format: int32
        description: The number of records by which to offset the results. If paginating results, this should be equal to `([the page number you want to retrieve] - 1) * [limit]`. e.g. with a limit of 250, enter an offset of 0 for the first page, 250 for the second page, etc.
      limit:
        type: integer
        format: int32
        description: The number of records to retrieve in one call. Use along with the offset parameter to paginate results. Limit must be &#60;= 1000 to request more than 48 hours of data at once.

