# Linxup 2.0 API YAML
swagger: '2.0'
info:
  title: API Integration
  description:
    Integrate our system into your application via our API. To use it, the first thing
    you need is an API Token. You can obtain a token from your portal by visiting the "API / Developers"
    section in the Setup page. Once you have a token, you can try out the API on this page by first
    clicking the "Authorize" button and entering **Bearer &lt;token&gt;** in the value field (the "Bearer"
    prefix is required). After this
    point, you can click on any of the endpoints listed below and click the "Try it out" button to see
    the response.
    <br><br>

    Deprecation notice "agilisGeofenceId" is being deprecated and has been replaced by "geofenceUUID" as a identifier for geofences.
    Please update your application to use "geofenceUUID". We may remove "agilisGeofenceId" in a future release.

    <br><br>

    **Your API Host:** X_API_HOST_X
  version: "2.13"
# array of all schemes that your API supports
schemes:
  - https
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
# will be prefixed to all paths
basePath: /ibis/rest/api/v2
produces:
  - application/json
paths:
  /token/generate:
    post:
      summary: Generate Token
      description: |
        The token generation endpoint can be used to create a new API token programmatically instead of via the portal. Tokens will expire after 5 years and can be revoked via the portal.
      parameters:
        - name: authentication
          in: body
          description: A valid username and password
          required: true
          schema:
            $ref: '#/definitions/UsernameAndPassword'
      tags:
        - Authorization
      responses:
        200:
          description: An API token
          schema:
            $ref: '#/definitions/TokenResponse'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /locations:
    get:
      security:
        - Bearer: []
      summary: Get Locations
      description: |
        The locations endpoint returns the current gps locations of all your
        Linxup devices. The response includes other information like the VIN,
        make, model and year of the vehicle the device is plugged in, along
        with the battery and fuel level if available.

        SensorData is returned with the following units:
        - temperature: degrees Fahrenheit
        - humidity: relative percentage
      tags:
        - Locations
      responses:
        200:
          description: An array of locations
          schema:
            type: array
            items:
              $ref: '#/definitions/CurrentLocation'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
    post:
      security:
        - Bearer: []
      summary: Get Locations
      description: |
        The locations endpoint returns the current gps locations of all your
        Linxup devices. The response includes other information like the VIN,
        make, model and year of the vehicle the device is plugged in, along
        with the battery and fuel level if available.

        SensorData is returned with the following units:
        - temperature: degrees Fahrenheit
        - humidity: relative percentage

        **Please note:** This endpoint is supported for legacy reasons. Please use GET instead for new integrations.
      tags:
        - Locations
      responses:
        200:
          description: An array of locations
          schema:
            type: array
            items:
              $ref: '#/definitions/CurrentLocation'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /locations/{imei}:
    post:
      security:
        - Bearer: []
      summary: Get Locations for a specific device, given its imei.
      description: |
        All the locations a specific device has been in the provided from and
        to date.

        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.

        SensorData is returned with the following units:
        - temperature: degrees Fahrenheit
        - humidity: relative percentage

      parameters:
        - name: imei
          in: path
          description: imei of device.
          required: true
          type: string
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Locations
      responses:
        200:
          description: An array of locations
          schema:
            type: array
            items:
              $ref: '#/definitions/Location'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /locations/uuid/{uuid}:
    post:
      security:
        - Bearer: []
      summary: Get Locations for a specific device, given its UUID.
      description: |
        All the locations a specific device has been in the provided from and
        to date.

        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.

        SensorData is returned with the following units:
        - temperature: degrees Fahrenheit
        - humidity: relative percentage

      parameters:
        - name: uuid
          in: path
          description: UUID of device.
          required: true
          type: string
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Locations
      responses:
        200:
          description: An array of locations
          schema:
            type: array
            items:
              $ref: '#/definitions/Location'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /locations/all:
    post:
      security:
        - Bearer: []
      summary: Get Locations for ALL devices for the given date range.
      description: |
        All the locations that all device has been in the provided from and
        to date.

        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.

        SensorData is returned with the following units:
        - temperature: degrees Fahrenheit
        - humidity: relative percentage

      parameters:
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Locations
      responses:
        200:
          description: An array of locations
          schema:
            type: array
            items:
              $ref: '#/definitions/Location'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /stops:
    post:
      security:
        - Bearer: []
      summary: Get stops for all devices.
      description: |
        All the stops devices have made in the provided from and
        to date.

        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.

      parameters:
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of stops
          schema:
            type: array
            items:
              $ref: '#/definitions/Stop'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /stops/{searchBy}/{value}:
    post:
      security:
        - Bearer: [ ]
      summary: Get stops for a specific device, given its imei, uuid, or serial number.
      description: |
        All the stops a specific device has made in the provided from and to date.
        
        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.

      parameters:
        - name: searchBy
          in: path
          description: what to search by.
          required: true
          type: string
          enum: [ "IMEI", "UUID", "SERIAL_NUMBER"]
        - name: value
          in: path
          description: value of searchBy for device.
          required: true
          type: string
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of stops
          schema:
            type: array
            items:
              $ref: '#/definitions/Stop'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /trips:
    post:
      security:
        - Bearer: []
      summary: Get trips for all devices.
      description: |
        All the trips devices have made in the provided from and to date.

        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.

        Distances are rounded to the nearest mile. Detailed distances are provided to 3 decimal places.
      parameters:
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of trips
          schema:
            type: array
            items:
              $ref: '#/definitions/Trip'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /trips/{searchBy}/{value}:
    post:
      security:
        - Bearer: [ ]
      summary: Get trips for a specific device, given its imei, uuid, or serial number.
      description: |
        All the trips a specific device has made in the provided from and to date.
        
        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.

      parameters:
        - name: searchBy
          in: path
          description: what to search by.
          required: true
          type: string
          enum: [ "IMEI", "UUID", "SERIAL_NUMBER" ]
        - name: value
          in: path
          description: value of searchBy for device.
          required: true
          type: string
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of trips
          schema:
            type: array
            items:
              $ref: '#/definitions/Trip'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /advancedTrips:
    post:
      security:
        - Bearer: []
      summary: Get enhanced trip info for all devices in friendly format.
      description: |
        All the ignition, trips, stops and idling events devices have made in the
        provided from and to date.

        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.

        Distances are rounded to the nearest mile. Detailed distances are provided to 3 decimal places.
      parameters:
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of advanced trips
          schema:
            type: array
            items:
              $ref: '#/definitions/AdvancedTrip'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /advancedTrips/{searchBy}/{value}:
    post:
      security:
        - Bearer: [ ]
      summary: Get enhanced trip info for a specific device, given its imei, uuid, or serial number.
      description: |
        All the ignition, trips, stops and idling events a specific device has made in the provided from and to date.
        
        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.

      parameters:
        - name: searchBy
          in: path
          description: what to search by.
          required: true
          type: string
          enum: [ "IMEI", "UUID", "SERIAL_NUMBER" ]
        - name: value
          in: path
          description: value of searchBy for device.
          required: true
          type: string
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of advanced trips
          schema:
            type: array
            items:
              $ref: '#/definitions/AdvancedTrip'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /alerts:
    post:
      security:
        - Bearer: [ ]
      summary: Get alerts for all devices.
      description: |
        All the alerts devices have generated in the provided from and
        to date.
        
        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.
      parameters:
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of alerts
          schema:
            type: array
            items:
              $ref: '#/definitions/Alert'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /alerts/{searchBy}/{value}:
    post:
      security:
        - Bearer: []
      summary: Get alerts for a specific device, given its imei, uuid, or serial number.
      description: |
        All the alerts a specific device has generated in the provided from and to date.

        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.
      parameters:
        - name: searchBy
          in: path
          description: what to search by.
          required: true
          type: string
          enum: [ "IMEI", "UUID", "SERIAL_NUMBER" ]
        - name: value
          in: path
          description: value of searchBy for device.
          required: true
          type: string
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of alerts
          schema:
            type: array
            items:
              $ref: '#/definitions/Alert'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /usagehours:
    post:
      security:
        - Bearer: []
      summary: Get usage hours for all devices.
      description: |
        All the usage hours for devices in the provided from and
        to date.

        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.
      parameters:
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of usage hours
          schema:
            type: array
            items:
              $ref: '#/definitions/UsageHour'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /usagehours/{searchBy}/{value}:
    post:
      security:
        - Bearer: [ ]
      summary: Get usage hours for a specific device, given its imei, uuid, or serial number.
      description: |
        All the usage hours for a specific device in the provided from and
        to date.
        
        The dates should be specified as epoch timestamps in milliseconds
        and the range cannot be more than 48 hours.
      parameters:
        - name: searchBy
          in: path
          description: what to search by.
          required: true
          type: string
          enum: [ "IMEI", "UUID", "SERIAL_NUMBER" ]
        - name: value
          in: path
          description: value of searchBy for device.
          required: true
          type: string
        - name: dates
          in: body
          required: true
          schema:
            $ref: '#/definitions/FromToDates'
      tags:
        - Advanced Info
      responses:
        200:
          description: An array of usage hours
          schema:
            type: array
            items:
              $ref: '#/definitions/UsageHour'
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'

  /job/create:
    post:
      security:
        - Bearer: []
      summary: Create a new job and assign it to a user.
      description: |
        Create a new job at a given address and assign it to a user.
      parameters:
        - name: jobinfo
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateJobInfo'
      tags:
        - Jobs
      responses:
        200:
          description: UUID of created job.
          schema:
            $ref: '#/definitions/UuidResponse'
        403:
          description: Unauthorized.
        422:
          description: Validation error with submitted data.
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error.
          schema:
            $ref: '#/definitions/ErrorsMap'
  /job/get/{uuid}:
    post:
      security:
        - Bearer: []
      summary: Get job by UUID.
      description: |
        Get job by UUID.
      parameters:
        - name: uuid
          in: path
          description: UUID of job.
          required: true
          type: string
      tags:
        - Jobs
      responses:
        200:
          description: Job Information.
          schema:
            $ref: '#/definitions/Job'
        403:
          description: Unauthorized.
        404:
          description: Job not found.
        500:
          description: Unexpected error.
          schema:
            $ref: '#/definitions/Error'
  /job/update/{uuid}:
    post:
      security:
        - Bearer: []
      summary: Update job.
      description: |
        Update job information. Any field that is not submitted will be left blank. Assigned user cannot be updated through this endpoint--use /job/reassign instead.
      parameters:
        - name: uuid
          in: path
          description: UUID of job
          required: true
          type: string
        - name: jobinfo
          in: body
          required: true
          schema:
            $ref: '#/definitions/JobInfo'
      tags:
        - Jobs
      responses:
        200:
          description: The updated info for the job.
          schema:
            $ref: '#/definitions/Job'
        403:
          description: Unauthorized.
        404:
          description: Job not found.
        422:
          description: Validation error with submitted data.
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error.
          schema:
            $ref: '#/definitions/Error'
  /job/reassign/{uuid}:
    post:
      security:
        - Bearer: []
      summary: Reassign job
      description: |
        Reassign job to different user
      parameters:
        - name: uuid
          in: path
          description: uuid of job
          required: true
          type: string
        - name: emailMap
          in: body
          required: true
          schema:
            $ref: '#/definitions/EmailMap'
      tags:
        - Jobs
      responses:
        200:
          description: Job updated successfully.
        403:
          description: Unauthorized.
        404:
          description: Job not found.
        422:
          description: Validation error with submitted data.
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error.
          schema:
            $ref: '#/definitions/Error'
  /job/cancel/{uuid}:
    post:
      security:
        - Bearer: []
      summary: Cancel job
      description: |
        Cancel job if possible
      parameters:
        - name: uuid
          in: path
          description: uuid of job
          required: true
          type: string
      tags:
        - Jobs
      responses:
        200:
          description: Job cancelled successfully
        403:
          description: Unauthorized.
        404:
          description: Job not found.
        422:
          description: Validation error with submitted data.
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error.
          schema:
            $ref: '#/definitions/Error'
  /job/complete/{uuid}:
    post:
      security:
        - Bearer: []
      summary: Complete job
      description: |
        Complete job if possible
      parameters:
        - name: uuid
          in: path
          description: uuid of job
          required: true
          type: string
      tags:
        - Jobs
      responses:
        200:
          description: Job completed successfully, or job already complete.
        403:
          description: Unauthorized.
        404:
          description: Job not found.
        422:
          description: Validation error with submitted data.
          schema:
            $ref: '#/definitions/ErrorsMap'
        500:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /geofences:
    get:
      security:
        - Bearer: []
      summary: Get Geofences
      description: |
        Returns all active geofences.
      parameters:
        - name: includeInactive
          in: query
          description: Include inactive geofences in the response
          required: false
          type: boolean
          default: false
      tags:
        - Geofences
      responses:
        200:
          description: An array of geofences
          schema:
            type: array
            items:
              $ref: '#/definitions/GeofenceWithGeofenceUUID'
        403:
          description: Unauthorized
        500:
          description: Unexpected error
    post:
      security:
        - Bearer: []
      summary: Create a new geofence
      description: |
        Creates a new geofence at requested location.

        A name for the geofence must be provided.

        The color is optional.

        The type for the geofence must be one of '**Circle**', '**Polygon**' or '**Landmark**' with the following requirements:

        '**Circle**': One point and a radius must be provided.

        '**Polygon**': At least 3 points and no radius must be provided.

        '**Landmark**': One point and no radius must be provided.

      tags:
        - Geofences
      parameters:
        - name: geofenceInfo
          in: body
          required: true
          schema:
            $ref: '#/definitions/GeofenceInfo'
      responses:
        201:
          description: Unique identifier of created geofence
          schema:
            $ref: '#/definitions/GeofenceUUIDResponse'
        403:
          description: Unauthorized
        422:
          description: Invalid geofence definition or invalid tracker/driver/group ID
          schema:
            $ref: '#/definitions/InvalidGeofence'
        500:
          description: Unexpected error

  /geofences/{geofenceUUID}:
    get:
      security:
        - Bearer: []
      summary: Get specified geofence
      description: |
        Returns specified geofence.
      tags:
        - Geofences
      parameters:
        - name: geofenceUUID
          in: path
          description: Unique identifier of geofence.
          required: true
          type: string

        - name: includeInactive
          in: query
          description: Include inactive geofences in the response
          required: false
          type: boolean
          default: false
      responses:
        200:
          description: Geofence information
          schema:
            $ref: '#/definitions/GeofenceWithGeofenceUUID'
        403:
          description: Unauthorized
        404:
          description: Geofence not found
        422:
          description: Missing agilisGeofenceId
        500:
          description: Unexpected error

    put:
      security:
        - Bearer: []
      summary: Update an existing geofence
      description: |
        Updates an existing geofence with information provided. Please note that all fields must be provided.

        A name for the geofence must be provided.

        The color is optional.

        The type for the geofence must be one of '**Circle**', '**Polygon**' or '**Landmark**' with the following requirements

        '**Circle**': One point and a radius must be provided.

        '**Polygon**': At least 3 points and no radius must be provided.

        '**Landmark**': One point and no radius must be provided.

        A geofence can only be set up for notifications on trackers, drivers, **or** groups. As a result:
        * Only one of these lists can be sent with a request.
        * If any of these fields are sent, the other items will be deleted. (Submitting drivers will remove all existing tracker-based geofence notifications, etc.)
        * If none of these fields are sent, any existing notifications will be unchanged.

        Note: Updating a previously deleted geofence will undelete the geofence.

      tags:
        - Geofences
      parameters:
        - name: geofenceUUID
          in: path
          description: Unique identifier of geofence.
          required: true
          type: string
        - name: geofenceInfo
          in: body
          required: true
          schema:
            $ref: '#/definitions/GeofenceInfo'
      responses:
        204:
          description: Geofence information
          schema:
            $ref: '#/definitions/GeofenceWithGeofenceUUID'
        403:
          description: Unauthorized
        404:
          description: Geofence not found
        422:
          description: Invalid geofence definition or invalid tracker/driver/group ID
          schema:
            $ref: '#/definitions/InvalidGeofence'
        500:
          description: Unexpected error
    delete:
      security:
        - Bearer: []
      summary: Delete a geofence
      description: |
        Deletes the specified geofence.
      tags:
        - Geofences
      parameters:
        - name: geofenceUUID
          in: path
          description: Unique identifier of geofence.
          required: true
          type: string
      responses:
        204:
          description: Geofence deleted successfully
        403:
          description: Unauthorized
        404:
          description: Geofence not found
        500:
          description: Unexpected error

  /geofences/bulk:
    delete:
      security:
        - Bearer: []
      summary: Deactivate Geofences
      description: |
        Deactivate geofences. Contains an optional JSON body, that is a simple array of geofence UUIDs to deactivate. If this list is not specified, then deactivate ALL of the geofences.
      tags:
        - Geofences
      parameters:
        - in: body
          name: deactivationRequest
          description: An optional array of geofence UUIDs to deactivate
          required: false
          schema:
            $ref: '#/definitions/GeofenceBulkRequestRequest'
      responses:
        200:
          description: Successfully deactivated geofences
        400:
          description: Bad Request
        403:
          description: Unauthorized
        404:
          description: A requested geofence was not found
        500:
          description: Unexpected error

    put:
      security:
        - Bearer: []
      summary: Reactivate Geofences
      description: |
        Reactivate geofences. Contains an optional JSON body, that is a simple array of geofence UUIDs to reactivate. If this list is not specified, then reactivate ALL of the geofences.
      tags:
        - Geofences
      parameters:
        - in: body
          name: reactivationRequest
          description: An optional array of geofence UUIDs to reactivate
          required: false
          schema:
            $ref: '#/definitions/GeofenceBulkRequestRequest'
